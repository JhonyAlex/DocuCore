services:
  app:
    image: ghcr.io/jhonyalex/docucore-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-docucore}:${DB_PASSWORD:-docucore}@db:5432/${DB_NAME:-docucore}?schema=public
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://app.report-map.online}
      - MARKETING_PUBLIC_URL=${MARKETING_PUBLIC_URL:-https://report-map.online}
      - SESSION_SECRET=${SESSION_SECRET}
      - COMPANY_DISPLAY_NAME=${COMPANY_DISPLAY_NAME:-Report Map Online}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-admin@report-map.online}
      - BILLING_PROVIDER=${BILLING_PROVIDER:-stripe}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - EMAIL_MODE=${EMAIL_MODE:-smtp}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - EMAIL_FROM=${EMAIL_FROM:-admin@report-map.online}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Report Map Online}
      - DOCUMENT_STORAGE_PATH=/app/storage/documents
      - FLOOR_PLAN_STORAGE_PATH=/app/storage/floor-plans
    volumes:
      - documents_data:/app/storage/documents
      - floor_plans_data:/app/storage/floor-plans
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  landing:
    image: ghcr.io/jhonyalex/docucore-landing:latest
    build:
      context: .
      dockerfile: Dockerfile.landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-8080}:80"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-docucore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docucore}
      POSTGRES_DB: ${DB_NAME:-docucore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-docucore} -d ${DB_NAME:-docucore}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  documents_data:
  floor_plans_data:
