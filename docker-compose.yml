services:
  db:
    image: postgres:16-alpine
    container_name: docucore-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docucore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docucore}
      POSTGRES_DB: ${POSTGRES_DB:-docucore}
    ports:
      - "${DB_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-docucore}:${POSTGRES_PASSWORD:-docucore}@db:5432/${POSTGRES_DB:-docucore}?schema=public
      DOCUMENT_STORAGE_PATH: /app/data/documents
      FLOOR_PLAN_STORAGE_PATH: /app/data/floor-plans
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - document_data:/app/data/documents
      - floor_plan_data:/app/data/floor-plans
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  document_data:
  floor_plan_data:
