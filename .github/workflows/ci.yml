name: CI Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docucore:docucore@127.0.0.1:5432/docucore?schema=public
      DOCUCORE_DB_PORT: "5432"
      NODE_ENV: test
      CI: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docucore
          POSTGRES_PASSWORD: docucore
          POSTGRES_DB: docucore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and Validate Prisma Schema
        run: |
          pnpm prisma generate
          pnpm prisma validate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Deploy Database Schema (Fresh DB Migration)
        env:
          DATABASE_URL: postgresql://docucore:docucore@127.0.0.1:5432/docucore?schema=public
        run: pnpm db:deploy

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://docucore:docucore@127.0.0.1:5432/docucore?schema=public
        run: pnpm db:seed

      - name: Run Unit & API Tests
        env:
          DATABASE_URL: postgresql://docucore:docucore@127.0.0.1:5432/docucore?schema=public
          NODE_ENV: test
        run: pnpm test

      - name: Build Application
        run: pnpm build

      - name: Run Smoke Tests
        env:
          DATABASE_URL: postgresql://docucore:docucore@127.0.0.1:5432/docucore?schema=public
          NODE_ENV: test
        run: pnpm test:smoke

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E & Visual Regression Tests
        env:
          DATABASE_URL: postgresql://docucore:docucore@127.0.0.1:5432/docucore?schema=public
          DOCUCORE_DB_PORT: '5432'
          NODE_ENV: test
        run: |
          pnpm test:e2e
          pnpm test:visual
